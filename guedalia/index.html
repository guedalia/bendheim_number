<style>
:root{
  --bg:#ffffff; --panel:#f7f7f5; --line:#e3e3df; --ink:#1c1c1a; --dim:#6b6b66;
  --accent:#2f5d8c; --accent-soft:#eaf1f8; --good:#dff3e4; --good-line:#8dc79f;
  --warn:#fdf1d8; --warn-line:#e0bd6a; --bad:#fbe4e4; --bad-line:#d99a9a; --anc:#fff6e0; --anc-line:#e0bd6a;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
header h1{font-size:18px;margin:0;font-weight:600}

header .sub{color:var(--dim);font-size:13px}
header .right{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header .acct{display:contents}
header .hsearch{position:relative}
header .sbtn{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;line-height:0}
header .sbox{display:none;position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:25;width:min(460px,calc(100vw - 28px));
  background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:10px}
header .hsearch.open .sbox{display:block}

@media (max-width:640px){
  header .burger{display:inline-block;position:absolute;top:10px;inset-inline-end:62px}
  header .acct{display:none;position:absolute;top:100%;inset-inline-end:12px;z-index:20;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:10px;
    flex-direction:column;align-items:stretch;gap:8px;min-width:200px}
  header .acct.open{display:flex}
  header .hsearch{position:absolute;top:10px;inset-inline-end:12px}
  header .sbox{position:fixed;top:58px;inset-inline:12px;width:auto}
  header > div:first-child{padding-inline-end:108px}
  header .acct .sub{order:-1;padding:2px 4px 6px;border-bottom:1px solid var(--line);font-size:12.5px;overflow-wrap:anywhere}

}
main{padding:20px 16px;max-width:780px;margin:0 auto}

.diag text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-anchor:middle;fill:var(--ink)}

.diag text.n{font-size:13px;font-weight:600}

.hit:hover{background:var(--accent-soft)}

.welcome p{margin:6px 0 12px;color:var(--ink)}
@media (max-width:640px){ .who{font-size:22px} .row .rt{margin-inline-start:0;width:100%;text-align:start} }

<header>
  <div>
    <h1><a href="#" id="home">Guedalia family connections</a></h1>

  </div>

  <div class="hsearch" id="hsearch" style="display:none">
    <button class="ghost sbtn" id="sBtn" aria-label="Search" aria-expanded="false" aria-controls="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <div class="sbox" id="sbox">

<main>
  <div id="loading" class="loading" role="status" aria-live="polite"><span class="spin big"></span><div>Loading the family…</div></div>

<script>
const SUPA_URL = 'https://ahomwnlimuxinttwrikr.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFob213bmxpbXV4aW50dHdyaWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI5MTUsImV4cCI6MjA4OTIzODkxNX0.B5y9pilGpPM2xxkC30nZfJhUKOPFI8ELSZjbYF5HNeM';
const LOGIN_DOMAIN = 'guedalia.com';   // "josh" signs in as josh@guedalia.com
const asEmail = v => { v = (v || '').trim().toLowerCase(); return v && !v.includes('@') ? v + '@' + LOGIN_DOMAIN : v; };
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Everyone from every tree, merged so that each person appears once with a father, a mother and partners.
let P = new Map(), KIDS = new Map(), PART = new Map(), CUR = null;
let ME = null;
try { ME = localStorage.getItem('guedalia_me') || null; } catch (e) {}

const YR = /(1[0-9]{3}|20[0-9]{2})/;
const year = s => { const m = YR.exec(s || ''); return m ? +m[1] : null; };
function years(p){
  const b = year(p.born), d = year(p.died);
  if (b && d) return b + '–' + d;
  if (b) return 'b. ' + b + (p.deceased ? ' †' : '');
  if (d) return 'd. ' + d;
  return p.deceased ? '†' : '';
}
const first = p => (p.name || '').replace(/\([^)]*\)|\{[^}]*\}|"[^"]*"/g, ' ').trim().split(/\s+/)[0] || p.name;
const G = (p, m, f, n) => p && p.sex === 'M' ? m : p && p.sex === 'F' ? f : n;

function index(rows){
  P = new Map(); KIDS = new Map(); PART = new Map();
  rows.forEach(p => P.set(p.id, p));
  rows.forEach(p => {
    [p.father, p.mother].forEach(x => { if (x && P.has(x)){ if (!KIDS.has(x)) KIDS.set(x, []); KIDS.get(x).push(p.id); } });
    PART.set(p.id, (p.spouses || []).filter(s => P.has(s.id)));
  });
  KIDS.forEach(a => a.sort((x, y) => {
    const X = P.get(x), Y = P.get(y), bx = year(X.born), by = year(Y.born);
    if (bx && by && bx !== by) return bx - by;
    return (X.ord - Y.ord) || x.localeCompare(y);
  }));
  rows.forEach(p => { p._s = norm([p.name, p.heb, p.alt, p.maiden].join(' ')); });
}

// ---------- search ----------
function norm(s){
  return String(s || '').normalize('NFKD').replace(/[̀-֑ͯ-ׇ]/g, '').toLowerCase()
    .replace(/[׳״"'`’‘]/g, '').replace(/[^a-z0-9א-ת]+/g, ' ').trim();
}
function searchPeople(q){
  const t = norm(q).split(' ').filter(Boolean);
  if (!t.length) return [];
  const out = [];
  P.forEach(p => {
    const words = p._s.split(' ');
    if (t.every(x => words.some(w => w.startsWith(x)))){
      const exact = t.filter(x => words.includes(x)).length;
      out.push([exact, p]);
    }
  });
  out.sort((a, b) => b[0] - a[0] || (year(a[1].born) || 3000) - (year(b[1].born) || 3000));
  return out.slice(0, 60).map(x => x[1]);
}
function parentsLine(p){
  const f = p.father && P.get(p.father), m = p.mother && P.get(p.mother);
  if (!f && !m) return '';
  return G(p, 'son of ', 'daughter of ', 'child of ') + [f, m].filter(Boolean).map(first).join(' & ');
}
function hitsHtml(list, target){
  if (!list.length) return '<div class="empty">No one by that name.</div>';
  return list.map(p => '<button class="hit" data-go="' + esc(p.id) + '">' + esc(p.name)
    + (p.heb && p.heb !== p.name ? ' <span dir="rtl">' + esc(p.heb) + '</span>' : '')
    + '<span class="s">' + esc([years(p), parentsLine(p)].filter(Boolean).join(' · ')) + '</span></button>').join('');
}

// ---------- how two people are related ----------
// A route through the family: up to a parent, down to a child, or across to a partner. Once a route has gone down
// it may not go up again (that would make a step-relation look like blood), but a partner opens the way up again.
// With partners priced out the cheapest route is the blood relationship; priced in, the closest by marriage.
function heapPush(h, x){ h.push(x); let i = h.length - 1;
  while (i > 0){ const q = (i - 1) >> 1; if (h[q][0] <= h[i][0]) break; [h[q], h[i]] = [h[i], h[q]]; i = q; } }
function heapPop(h){ const top = h[0], last = h.pop();
  if (h.length){ h[0] = last; let i = 0;
    for (;;){ const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r;
      if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } }
  return top; }

function route(a, b, spCost){
  if (a === b) return [{id: a, edge: null}];
  const dist = new Map(), prev = new Map(), h = [];
  const K = (id, up) => id + (up ? '|u' : '|d');
  dist.set(K(a, true), 0); heapPush(h, [0, a, true]);
  while (h.length){
    const [d, x, up] = heapPop(h), k = K(x, up);
    if (d > dist.get(k)) continue;
    if (x === b){
      const path = []; let cur = k;
      while (cur){ const pv = prev.get(cur); path.push({id: cur.slice(0, -2), edge: pv ? pv.edge : null}); cur = pv ? pv.k : null; }
      return path.reverse();
    }
    const relax = (y, u, c, edge) => { const kk = K(y, u), nd = d + c;
      if (!dist.has(kk) || nd < dist.get(kk)){ dist.set(kk, nd); prev.set(kk, {k, edge}); heapPush(h, [nd, y, u]); } };
    const p = P.get(x);
    if (up){ if (p.father && P.has(p.father)) relax(p.father, true, 1, 'up'); if (p.mother && P.has(p.mother)) relax(p.mother, true, 1, 'up'); }
    (KIDS.get(x) || []).forEach(c => relax(c, false, 1, 'down'));
    if (spCost < Infinity) (PART.get(x) || []).forEach(s => relax(s.id, true, spCost, 'sp'));
  }
  return null;
}

// a route cut at each marriage into blood stretches: up a generations to a shared ancestor, down b
function segments(path){
  const segs = [], hops = [];
  let cur = [path[0].id], ups = 0, downs = 0;
  for (let i = 1; i < path.length; i++){
    const st = path[i];
    if (st.edge === 'sp'){
      segs.push({ids: cur, a: ups, b: downs});
      const from = path[i - 1].id, link = (PART.get(from) || []).find(s => s.id === st.id) || {};
      hops.push({from, to: st.id, divorced: !!link.divorced, married: link.married || ''});
      cur = [st.id]; ups = 0; downs = 0;
    } else {
      cur.push(st.id);
      if (st.edge === 'up') ups++; else downs++;
    }
  }
  segs.push({ids: cur, a: ups, b: downs});
  segs.forEach(s => {
    s.half = false; s.couple = null;
    if (s.a >= 1 && s.b >= 1){
      const c1 = P.get(s.ids[s.a - 1]), c2 = P.get(s.ids[s.a + 1]), top = s.ids[s.a];
      const other = c1.father === top ? c1.mother : c1.father;
      const full = other && c1.father && c1.mother && c1.father === c2.father && c1.mother === c2.mother;
      s.half = !full;
      if (full) s.couple = other;
    } else if (s.a >= 1 || s.b >= 1){
      // a direct line: the shared ancestor's partner is the other grandparent too only if both lines run through them
      s.couple = null;
    }
  });
  return {segs, hops};
}

const greats = n => n <= 0 ? '' : n === 1 ? 'great-' : n === 2 ? 'great-great-' : n + '× great-';
const anc = (n, p) => n === 1 ? G(p, 'father', 'mother', 'parent') : greats(n - 2) + G(p, 'grandfather', 'grandmother', 'grandparent');
const ancPl = n => n === 1 ? 'parents' : greats(n - 2) + 'grandparents';
const desc = (n, p) => n === 1 ? G(p, 'son', 'daughter', 'child') : greats(n - 2) + G(p, 'grandson', 'granddaughter', 'grandchild');
function ordn(n){ const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
const times = n => n === 1 ? 'once' : n === 2 ? 'twice' : n === 3 ? 'three times' : n + ' times';
function term(a, b, p, half){
  const h = half ? 'half-' : '';
  if (a === 0 && b === 0) return 'you';
  if (a === 0) return desc(b, p);
  if (b === 0) return anc(a, p);
  if (a === 1 && b === 1) return h + G(p, 'brother', 'sister', 'sibling');
  if (a === 1) return h + greats(b - 2) + G(p, 'nephew', 'niece', 'nephew / niece');
  if (b === 1) return h + greats(a - 2) + G(p, 'uncle', 'aunt', 'uncle / aunt');
  const d = Math.min(a, b) - 1, r = Math.abs(a - b);
  return (half ? 'half ' : '') + ordn(d) + ' cousin' + (r ? ' ' + times(r) + ' removed' : '');
}
const mate = (p, ex) => (ex ? 'ex-' : '') + G(p, 'husband', 'wife', 'partner');
const endOf = s => P.get(s.ids[s.ids.length - 1]);
const isEmpty = s => s.a === 0 && s.b === 0;
const is = (s, a, b) => s.a === a && s.b === b;

// the everyday name for the common in-law relationships, else the chain ("your 1st cousin's husband's sister")
function relName(R){
  const {segs, hops} = R, t = endOf(segs[segs.length - 1]);
  if (segs.length === 1) return term(segs[0].a, segs[0].b, t, segs[0].half);
  if (segs.length === 2){
    const [s0, s1] = segs, h = hops[0];
    if (isEmpty(s0) && isEmpty(s1)) return mate(t, h.divorced);
    if (isEmpty(s0) && is(s1, 1, 0)) return G(t, 'father', 'mother', 'parent') + '-in-law';
    if (isEmpty(s0) && is(s1, 1, 1)) return G(t, 'brother', 'sister', 'sibling') + '-in-law';
    if (isEmpty(s0) && is(s1, 0, 1)) return 'step' + G(t, 'son', 'daughter', 'child');
    if (isEmpty(s1) && is(s0, 1, 1)) return G(t, 'brother', 'sister', 'sibling') + '-in-law';
    if (isEmpty(s1) && is(s0, 0, 1)) return G(t, 'son', 'daughter', 'child') + '-in-law';
    if (isEmpty(s1) && is(s0, 1, 0)) return 'step' + G(t, 'father', 'mother', 'parent');
    if (isEmpty(s1) && s0.b === 1 && s0.a >= 2) return greats(s0.a - 2) + G(t, 'uncle', 'aunt', 'uncle / aunt') + ' by marriage';
    if (is(s0, 0, 1) && is(s1, 1, 0)) return G(t, 'co-father-in-law (mechutan)', 'co-mother-in-law (machatenista)', 'co-parent-in-law');
  }
  const parts = [];
  segs.forEach((s, i) => {
    if (!isEmpty(s)) parts.push(term(s.a, s.b, endOf(s), s.half));
    if (i < hops.length) parts.push(mate(P.get(hops[i].to), hops[i].divorced));
  });
  return parts.join('’s ');
}

const relCache = new Map();
function relate(a, b){
  const key = a + '>' + b;
  if (relCache.has(key)) return relCache.get(key);
  const blood = route(a, b, Infinity);
  const wide = route(a, b, 2.5);
  let out = null;
  if (blood){
    const R = segments(blood); R.kind = 'blood'; R.name = relName(R); R.steps = blood.length - 1;
    out = {main: R};
    if (wide && wide.some(s => s.edge === 'sp') && wide.length - 1 < R.steps - 2){
      const W = segments(wide); W.kind = 'marriage'; W.name = relName(W); out.also = W;
    }
  } else if (wide){
    const W = segments(wide); W.kind = 'marriage'; W.name = relName(W); out = {main: W};
  }
  relCache.set(key, out);
  return out;
}
const shortRel = id => { if (!ME || !P.has(ME)) return ''; if (id === ME) return 'you';
  const r = relate(ME, id); return r ? 'your ' + r.main.name : ''; };

// ---------- the picture: each blood stretch as a small tree, the shared ancestor on top ----------
function segSvg(s, meId, themId, labelOf){
  const W = 158, H = 60, GAP = 18, ROW = 82;
  const top = s.ids[s.a];
  const left = s.ids.slice(0, s.a).reverse();          // just below the ancestor ... down to the start
  const right = s.ids.slice(s.a + 1);                   // just below the ancestor ... down to the end
  const two = left.length && right.length;
  const width = two ? W * 2 + GAP : W;
  const rows = 1 + Math.max(left.length, right.length);
  const lx = 0, rx = two ? W + GAP : 0, cx = width / 2;
  const cut = (t, n) => t && t.length > n ? t.slice(0, n - 1) + '…' : (t || '');
  const box = (x, y, id, cls, w, label, line1, line2) =>
    '<g class="bx' + cls + '" data-go="' + esc(id) + '" transform="translate(' + x + ',' + y + ')">'
    + '<rect width="' + w + '" height="' + H + '" rx="8"/>'
    + '<text class="l" x="' + w / 2 + '" y="15">' + esc(cut(label, Math.round(w / 6.2))) + '</text>'
    + '<text class="n" x="' + w / 2 + '" y="34">' + esc(cut(line1, Math.round(w / 7.6))) + '</text>'
    + '<text class="y" x="' + w / 2 + '" y="50">' + esc(cut(line2, Math.round(w / 6.4))) + '</text></g>';
  const cls = id => id === meId ? ' me' : id === themId ? ' them' : '';
  let g = '';
  // the shared ancestor (with the partner both lines descend from)
  const tp = P.get(top), cp = s.couple && P.get(s.couple);
  const isAnc = s.a >= 1 && s.b >= 1;
  const tw = two && cp ? width : W, tx = cx - tw / 2;
  if (cp) g += box(tx, 0, top, ' anc', tw, labelOf(top, 'top'), tp.name + ' & ' + cp.name,
                   [years(tp), years(cp)].filter(Boolean).join('  ·  '));
  else g += box(tx, 0, top, isAnc ? ' anc' : cls(top), tw, labelOf(top, 'top'), tp.name, years(tp));
  const col = (list, x) => list.forEach((id, i) => {
    const y = (i + 1) * ROW, p = P.get(id);
    if (i) g += '<path class="ln" d="M' + (x + W / 2) + ' ' + (y - ROW + H) + ' V' + y + '"/>';
    g += box(x, y, id, cls(id), W, labelOf(id), p.name, years(p));
  });
  if (two){
    g += '<path class="ln" d="M' + cx + ' ' + H + ' V' + (ROW - 11) + ' M' + (lx + W / 2) + ' ' + (ROW - 11)
       + ' H' + (rx + W / 2) + ' M' + (lx + W / 2) + ' ' + (ROW - 11) + ' V' + ROW + ' M' + (rx + W / 2)
       + ' ' + (ROW - 11) + ' V' + ROW + '"/>';
  } else if (left.length || right.length){
    g += '<path class="ln" d="M' + cx + ' ' + H + ' V' + ROW + '"/>';
  }
  col(left, lx); col(right, rx);
  const hgt = rows * ROW - (ROW - H);
  return '<svg viewBox="-4 -4 ' + (width + 8) + ' ' + (hgt + 8) + '" width="' + (width + 8) + '">' + g + '</svg>';
}

function picture(R, meId, themId){
  let html = '';
  R.segs.forEach((s, i) => {
    const start = P.get(s.ids[0]);
    // labels: in the first stretch relative to me; after a marriage relative to that stretch's first person
    const labelOf = (id, where) => {
      const k = s.ids.indexOf(id), pp = P.get(id);
      let t;
      if (k === 0 && i > 0) return first(P.get(R.hops[i - 1].from)) + '’s ' + mate(pp, R.hops[i - 1].divorced);
      if (k <= s.a){
        const up = k;
        t = up === 0 ? '' : where === 'top' && s.couple ? ancPl(up) : anc(up, pp);
      } else t = term(s.a, k - s.a, pp, s.half);
      if (!t) return i === 0 ? 'you' : '';
      return i === 0 ? 'your ' + t : first(start) + '’s ' + t;
    };
    if (i > 0){
      const h = R.hops[i - 1];
      html += '<div class="hop">⚭ <b>' + esc(P.get(h.from).name) + '</b> '
        + (h.divorced ? 'was married to' : 'married') + ' <b>' + esc(P.get(h.to).name) + '</b>'
        + (h.married ? ' <span class="mdate">(' + esc(h.married) + ')</span>' : '') + '</div>';
    }
    html += segSvg(s, meId, themId, labelOf);
  });
  return '<div class="diag">' + html + '</div>';
}

function whyLine(R, them){
  // one sentence per blood stretch that rises to a shared ancestor
  const out = [];
  R.segs.forEach((s, i) => {
    if (!(s.a >= 1 && s.b >= 1)) return;
    const a = P.get(s.ids[0]), b = endOf(s), top = P.get(s.ids[s.a]), cp = s.couple && P.get(s.couple);
    const anc_ = cp ? esc(top.name) + ' and ' + esc(cp.name) : esc(top.name);
    const youA = i === 0 ? 'You' : esc(first(a));
    const yours = i === 0 ? 'your' : G(a, 'his', 'her', 'their');
    const w = n => cp ? ancPl(n) : anc(n, top);
    out.push(youA + ' and ' + esc(first(b)) + ' both descend from <b>' + anc_ + '</b>'
      + (years(top) ? ' (' + esc(years(top)) + ')' : '') + ': ' + yours + ' ' + w(s.a)
      + (s.a === s.b ? ', and ' + G(b, 'his', 'hers', 'theirs') + ' too.' : ', ' + G(b, 'his', 'her', 'their') + ' ' + w(s.b) + '.')
      + (s.half ? ' Only one of ' + (s.a === 1 ? 'the parents' : 'that couple') + ' is shared, so it is a half relationship.' : ''));
  });
  return out.map(x => '<div class="why">' + x + '</div>').join('');
}

// ---------- pages ----------
function setMe(id){
  ME = id; relCache.clear();
  try { id ? localStorage.setItem('guedalia_me', id) : localStorage.removeItem('guedalia_me'); } catch (e) {}
  meBtn(); show();
}
function go(id){ location.hash = '#' + encodeURIComponent(id); }

function sourceChips(p){
  const out = [];
  (p.refs || []).forEach(r => {
    const [t, v] = [r.slice(0, 1), r.slice(2)];
    if (t === 'P') out.push('<a class="chip" href="../prins/#p' + esc(v) + '" target="_blank" rel="noopener">Prins tree</a>');
    if (t === 'T') out.push('<a class="chip" href="../tal/#p' + esc(v) + '" target="_blank" rel="noopener">Tal tree</a>');
    if (t === 'F' && /^2\.1\.2[0-9.]*(S\d*)?$/.test(v)) out.push('<a class="chip" href="../?p=' + esc(v) + '" target="_blank" rel="noopener">Bendheim ' + esc(v) + '</a>');
    else if (t === 'F' || t === 'G') out.push('<span class="chip">Felsenstein</span>');
    if (t === 'E') out.push('<span class="chip">Esti’s family history</span>');
  });
  return [...new Set(out)].join('');
}

function row(id, extra){
  const p = P.get(id);
  return '<div class="row">' + (extra || '') + '<button class="nm" data-go="' + esc(id) + '">' + esc(p.name) + '</button>'
    + (p.heb && p.heb !== p.name ? '<span class="hb" dir="rtl">' + esc(p.heb) + '</span>' : '')
    + '<span class="yr">' + esc(years(p)) + '</span>'
    + '<span class="rt">' + esc(shortRel(id)) + '</span></div>';
}

function personHtml(p){
  let h = '<div class="card">';
  h += '<div class="who">' + esc(p.name) + '</div>';
  if (p.heb && p.heb !== p.name) h += '<div class="heb" dir="rtl">' + esc(p.heb) + '</div>';
  const life = [];
  if (p.born) life.push('Born ' + p.born + (p.place ? ', ' + p.place : ''));
  else if (p.place) life.push('From ' + p.place);
  if (p.died) life.push('died ' + p.died);
  else if (p.deceased) life.push('deceased');
  if (life.length) h += '<div class="meta">' + esc(life.join(' · ')) + '</div>';
  if (p.maiden) h += '<div class="meta">née ' + esc(p.maiden) + '</div>';
  if (p.alt) h += '<div class="meta">Also known as: ' + esc(p.alt.split(' ; ').slice(0, 6).join(', ')) + '</div>';
  if (p.note) h += '<div class="meta">' + esc(p.note) + '</div>';
  h += '<div class="chips">' + sourceChips(p) + '</div>';

  // how am I related
  if (!ME || !P.has(ME)){
    h += '<div class="relbox"><div>Is this you? Choose yourself once and every card will show how you are related.</div>'
       + '<div class="btns"><button class="big" id="bMe">This is me</button></div></div>';
  } else if (ME === p.id){
    h += '<div class="relbox"><span class="rel me">This is you</span>'
       + '<div class="btns"><button class="ghost" id="bNotMe">This is not me</button></div></div>';
  } else {
    const r = relate(ME, p.id);
    if (!r) h += '<div class="relbox"><span class="rel none">No connection found in the trees we hold</span></div>';
    else {
      h += '<div class="relbox"><div class="meta" style="margin:0 0 4px">' + esc(first(p)) + ' is</div>'
         + '<span class="rel">your ' + esc(r.main.name) + '</span>'
         + (r.main.kind === 'marriage' ? ' <span class="meta">(by marriage)</span>' : '')
         + whyLine(r.main, p) + picture(r.main, ME, p.id);
      if (r.also) h += '<div class="alsob">Also, by marriage: <b>your ' + esc(r.also.name) + '</b> '
         + '<button class="link" id="bAlso">show</button></div><div id="alsoPic" style="display:none">' + picture(r.also, ME, p.id) + '</div>';
      h += '</div>';
    }
  }

  // family
  const par = [p.father, p.mother].filter(x => x && P.has(x));
  h += '<h3>Parents</h3>' + (par.length ? '<div class="list">' + par.map(x => row(x)).join('') + '</div>' : '<div class="empty">Not recorded.</div>');
  const parts = PART.get(p.id) || [];
  if (parts.length) h += '<h3>' + (parts.length > 1 ? 'Partners' : G(p, 'Wife', 'Husband', 'Partner')) + '</h3><div class="list">'
    + parts.map(s => row(s.id, s.divorced ? '<span title="divorced">✕</span>' : '').replace('</div>', (s.married ? '<span class="mdate">⚭ ' + esc(s.married) + '</span>' : '') + '</div>')).join('') + '</div>';
  const sib = new Map();
  par.forEach(x => (KIDS.get(x) || []).forEach(c => { if (c !== p.id) sib.set(c, (sib.get(c) || 0) + 1); }));
  if (sib.size){
    const full = par.length === 2;
    const ids = [...sib.keys()].sort((x, y) => (year(P.get(x).born) || 3000) - (year(P.get(y).born) || 3000) || P.get(x).ord - P.get(y).ord);
    h += '<h3>Brothers and sisters</h3><div class="list">' + ids.map(c => row(c, full && sib.get(c) < 2 ? '<span class="yr">half</span>' : '')).join('') + '</div>';
  }
  const kids = KIDS.get(p.id) || [];
  if (kids.length){
    const by = new Map();
    kids.forEach(c => { const k = P.get(c), o = k.father === p.id ? k.mother : k.father; const key = o || ''; if (!by.has(key)) by.set(key, []); by.get(key).push(c); });
    h += '<h3>Children</h3>';
    by.forEach((list, o) => {
      if (by.size > 1) h += '<div class="meta" style="margin:8px 0 4px">with ' + (o && P.has(o) ? esc(P.get(o).name) : 'a partner not recorded') + '</div>';
      h += '<div class="list">' + list.map(c => row(c)).join('') + '</div>';
    });
  }
  return h + '</div>';
}

function welcomeHtml(){
  return '<div class="card welcome"><div class="who" style="font-size:21px">Who are you?</div>'
    + '<p>This brings every family tree we hold together: Prins, Bendheim, Felsenstein, Guedalia, Weisz, Lubashevsky and Tal. '
    + 'Find yourself once, press <b>This is me</b>, and every person will show how you are related, with a picture of the connection.</p>'
    + '<input type="text" id="q2" placeholder="Your name, in English or Hebrew…" autocomplete="off"><div class="hits" id="hits2"></div></div>';
}

function show(){
  const app = $('app');
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  CUR = id && P.has(id) ? P.get(id) : (ME && P.has(ME) ? P.get(ME) : null);
  app.innerHTML = CUR ? personHtml(CUR) : welcomeHtml();
  if ($('q2')){ $('q2').oninput = () => { $('hits2').innerHTML = hitsHtml(searchPeople($('q2').value)); }; $('q2').focus(); }
  if ($('bMe')) $('bMe').onclick = () => setMe(CUR.id);
  if ($('bNotMe')) $('bNotMe').onclick = () => setMe(null);
  if ($('bAlso')) $('bAlso').onclick = () => { const a = $('alsoPic'); a.style.display = a.style.display === 'none' ? '' : 'none'; };
  scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t){ e.preventDefault(); openSearch(false); go(t.getAttribute('data-go')); }
});
addEventListener('hashchange', () => { if (P.size) show(); });

function meBtn(){
  const b = $('meBtn'); if (!b) return;
  const m = ME && P.get(ME);
  b.textContent = m ? 'Me: ' + first(m) : 'Who am I?';
  b.onclick = () => { if (m){ if (CUR && CUR.id === m.id) show(); else go(m.id); } else { location.hash = ''; show(); } };
}

function openSearch(open){
  $('hsearch').classList.toggle('open', open);
  $('sBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) setTimeout(() => $('q').focus(), 0);
}
$('sBtn').onclick = e => { e.stopPropagation(); openSearch(!$('hsearch').classList.contains('open')); };
$('q').oninput = () => { $('hits').innerHTML = hitsHtml(searchPeople($('q').value)); };
$('q').onkeydown = e => { if (e.key === 'Escape'){ openSearch(false); $('sBtn').focus(); } };
document.addEventListener('click', e => { if (!e.target.closest('#hsearch')) openSearch(false); });
$('home').onclick = e => { e.preventDefault(); if (ME && P.has(ME)) go(ME); else { history.replaceState(null, '', location.pathname); show(); } };

// ---------- data + sign-in ----------
function noteVisit(kind){
  try { if (kind === 'open' && sessionStorage.getItem('guedalia_seen')) return; if (kind === 'open') sessionStorage.setItem('guedalia_seen', '1'); } catch (e) {}
  sb.from('guedalia_visits').insert({who: window.__email || '', kind, device: innerWidth < 768 ? 'mobile' : 'desktop'}).then(() => {}, () => {});
}

async function load(){
  const PAGE = 1000, cols = 'id,name,heb,alt,maiden,sex,born,died,deceased,place,note,num,father,mother,spouses,ord,refs';
  const firstPage = await sb.from('guedalia_people').select(cols, {count: 'exact'}).order('id').range(0, PAGE - 1);
  if (firstPage.error){ $('loading').style.display = 'none'; $('app').style.display = '';
    $('app').innerHTML = '<div class="note err">' + esc(firstPage.error.message) + '</div>'; return; }
  const total = firstPage.count || firstPage.data.length, rest = [];
  for (let i = PAGE; i < total; i += PAGE) rest.push(sb.from('guedalia_people').select(cols).order('id').range(i, i + PAGE - 1));
  const pages = await Promise.all(rest);
  const bad = pages.find(r => r.error);
  if (bad){ $('loading').style.display = 'none'; $('app').style.display = ''; $('app').innerHTML = '<div class="note err">' + esc(bad.error.message) + '</div>'; return; }
  const rows = firstPage.data.concat(...pages.map(r => r.data));
  index(rows);
  $('counts').textContent = rows.length.toLocaleString('en') + ' people · Prins, Bendheim, Felsenstein, Guedalia, Weisz, Lubashevsky, Tal';
  $('login').style.display = 'none'; $('loading').style.display = 'none'; $('app').style.display = ''; $('hsearch').style.display = '';
  $('whoami').innerHTML = '<button class="ghost" id="meBtn"></button>'
    + ' <button class="ghost burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="acct">☰</button>'
    + ' <div class="acct" id="acct"><span class="sub">' + esc((window.__email || '').replace('@' + LOGIN_DOMAIN, '')) + '</span>'
    + ' <button class="ghost" id="out">Sign out</button></div>';
  const menu = open => { $('acct').classList.toggle('open', open); $('burger').setAttribute('aria-expanded', open ? 'true' : 'false'); };
  $('burger').onclick = e => { e.stopPropagation(); menu(!$('acct').classList.contains('open')); };
  document.addEventListener('click', e => { if (!e.target.closest('#acct,#burger')) menu(false); });
  $('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  meBtn(); show();
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){ window.__email = session.user.email; noteVisit('open'); return load(); }
  $('loading').style.display = 'none'; $('login').style.display = '';
  const busy = on => { $('go').disabled = on; $('em').disabled = on; $('pw').disabled = on;
    $('go').innerHTML = on ? '<span class="spin"></span>Signing in…' : 'Sign in'; };
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    if ($('go').disabled) return;
    if (!$('em').value.trim() || !$('pw').value){ $('loginMsg').innerHTML = '<div class="note err">User name and password, please.</div>'; return; }
    busy(true); $('loginMsg').innerHTML = '';
    const { error } = await sb.auth.signInWithPassword({ email: asEmail($('em').value), password: $('pw').value });
    if (error){ busy(false); $('loginMsg').innerHTML = '<div class="note err">' + esc(error.message) + '</div>'; $('pw').select(); return; }
    const { data: { session } } = await sb.auth.getSession();
    window.__email = session.user.email; noteVisit('login'); load();
  };
  $('em').focus();
}
boot();
</script>
